<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 680px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .card-header h2 {
            color: #4a00e0;
            font-size: 28px;
            font-weight: 700;
        }

        .card-header p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .subject-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
        }

        input, select {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            outline: none;
            flex: 1;
        }

        input:focus, select:focus {
            border-color: #764ba2;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.2s, background-color 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .btn-add {
            background-color: #e2e8f0;
            color: #4a5568;
            width: 100%;
            margin-top: 8px;
        }

        .btn-add:hover {
            background-color: #cbd5e0;
        }

        .btn-submit {
            background: linear-gradient(90deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        .btn-remove {
            background-color: #fed7d7;
            color: #e53e3e;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1;
        }

        .btn-remove:hover {
            background-color: #feb2b2;
        }

        .result-box {
            background: linear-gradient(135deg, #845ec2 0%, #d65db1 100%);
            color: white;
            padding: 20px;
            margin-top: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(132, 94, 194, 0.3);
            animation: fadeIn 0.5s ease-in-out;
        }

        .result-box h3 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .result-box p {
            font-size: 15px;
            opacity: 0.95;
            margin-top: 4px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #edf2f7;
            font-size: 14px;
            color: #718096;
        }

        footer strong {
            color: #764ba2;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h2>🎓 CGPA Calculator</h2>
            <p>Calculate your academic performance instantly</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div id="subject-container">
                <div class="subject-row">
                    <input type="text" placeholder="Subject Name" required>
                    <input type="number" name="credits" step="0.5" min="0.5" placeholder="Credits" required>
                    <select name="grades" required>
                        <option value="">Select Grade</option>
                        <option value="O">O (Outstanding - 10 Points)</option>
                        <option value="A+">A+ (Excellent - 9 Points)</option>
                        <option value="A">A (Very Good - 8 Points)</option>
                        <option value="B+">B+ (Good - 7 Points)</option>
                        <option value="B">B (Above Average - 6 Points)</option>
                        <option value="C">C (Average - 5 Points)</option>
                        <option value="P">P (Pass - 4 Points)</option>
                        <option value="F">F (Fail - 0 Points)</option>
                        <option value="AB">Ab (Absent - 0 Points)</option>
                    </select>
                </div>
            </div>

            <button type="button" class="btn-add" onclick="addRow()">+ Add Subject</button>
            <button type="submit" class="btn-submit">Calculate CGPA</button>
        </form>

        {% if cgpa %}
            <div class="result-box">
                <h3>Your CGPA: {{ cgpa }}</h3>
                <p><strong>Total Credits:</strong> {{ total_credits }}</p>
                <p><strong>Performance:</strong> {{ status }}</p>
            </div>
        {% endif %}

        <footer>
            Developed by <strong>Aniket Singh Parihar</strong>
        </footer>
    </div>

    <script>
        function addRow() {
            const container = document.getElementById('subject-container');
            const row = document.createElement('div');
            row.className = 'subject-row';
            row.innerHTML = `
                <input type="text" placeholder="Subject Name" required>
                <input type="number" name="credits" step="0.5" min="0.5" placeholder="Credits" required>
                <select name="grades" required>
                    <option value="">Select Grade</option>
                    <option value="O">O (Outstanding - 10 Points)</option>
                    <option value="A+">A+ (Excellent - 9 Points)</option>
                    <option value="A">A (Very Good - 8 Points)</option>
                    <option value="B+">B+ (Good - 7 Points)</option>
                    <option value="B">B (Above Average - 6 Points)</option>
                    <option value="C">C (Average - 5 Points)</option>
                    <option value="P">P (Pass - 4 Points)</option>
                    <option value="F">F (Fail - 0 Points)</option>
                    <option value="AB">Ab (Absent - 0 Points)</option>
                </select>
                <button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(row);
        }
    </script>
</body>
</html>
